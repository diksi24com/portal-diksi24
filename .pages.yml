media:
  input: static/images
  output: /images

content:
  - name: posts
    label: Artikel
    type: collection
    path: content/posts
    filename: "{year}-{month}-{day}-{slug}.md"
    view:
      fields: [title, date, draft, categories, views]
      sort: [date, desc]
    fields:
      - name: title
        label: Judul
        type: string
        required: true

      - name: date
        label: Tanggal
        type: date
        required: true

      - name: draft
        label: Draft
        type: boolean
        default: false

      - name: description
        label: Deskripsi
        type: text
        required: true

      - name: categories
        label: Kategori
        type: string
        list: true

      - name: tags
        label: Tags
        type: string
        list: true

      - name: views
        label: Jumlah Views
        type: number
        default: 0

      - name: comments
        label: Aktifkan Komentar
        type: boolean
        default: true

            - name: cover
        label: Gambar Cover
        type: object
        fields:
          - name: image
            label: Path Gambar
            type: image
          - name: caption
            label: Keterangan Foto (Caption)
            type: string
            required: false

      - name: body
        label: Isi Artikel
        type: rich-text
        required: true

  - name: pages
    label: Halaman
    type: collection
    path: content/pages
    filename: "{slug}.md"
    view:
      fields: [title, date, draft]
      sort: [title, asc]
    fields:
      - name: title
        label: Judul Halaman
        type: string
        required: true

      - name: date
        label: Tanggal
        type: date
        required: true

      - name: draft
        label: Draft
        type: boolean
        default: false

      - name: description
        label: Deskripsi
        type: text

      - name: body
        label: Isi Halaman
        type: rich-text
        required: true
