baseURL = 'https://diksi24.com/'
languageCode = 'id-id'
title = 'diksi.com'
theme = 'PaperMod'

[outputs]
  home = ["HTML", "RSS", "JSON"]

[taxonomies]
  category = "categories"
  tag = "tags"

[params]
  env = "production"
  description = "Portal berita Diksi24 - Fakta dalam Setiap Kata"
  author = "Redaksi"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false
  comments = false
  ShowSearchIcon = true

  [params.header]
    stickyMenu = true

  [params.assets]
    disableHLJS = true
    favicon = "/images/logo.webp"
    favicon16x16 = "/images/logo.webp"
    favicon32x32 = "/images/logo.webp"

  [params.analytics]
    google.SiteVerificationTag = ""

  [[params.socialIcons]]
    name = "facebook"
    url = "#"
  [[params.socialIcons]]
    name = "instagram"
    url = "#"
  [[params.socialIcons]]
    name = "tiktok"
    url = "#"
  [[params.socialIcons]]
    name = "whatsapp"
    url = "https://wa.me/6285359044824"

