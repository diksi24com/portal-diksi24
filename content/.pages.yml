media:
  input: static/images
  output: /images

content:
  - name: posts
    label: Artikel
    type: collection
    path: content/posts
    filename: "{year}-{month}-{day}-{slug}.md"
    view:
      fields: [title, date, draft, description]
    fields:
      - name: title
        label: Judul
        type: string
        required: true

      - name: date
        label: Tanggal
        type: date
        required: true

      - name: description
        label: Deskripsi
        type: text

      - name: tags
        label: Tags
        type: string
        list: true

      - name: categories
        label: Kategori
        type: string
        list: true

      - name: draft
        label: Draft
        type: boolean
        default: false

      - name: thumbnail
        label: Gambar Utama
        type: image

      - name: body
        label: Isi Artikel
        type: rich-text
        required: true
