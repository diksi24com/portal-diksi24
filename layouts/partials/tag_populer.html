{{- if site.Taxonomies.tags }}
<div style="margin:32px 0 0 0;padding:0;">
  <div style="display:block;margin:0 0 16px 0;padding:0;">
    <span style="display:inline-block;font-size:14px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#1f2937;padding-bottom:8px;border-bottom:3px solid #e60000;">🏷️ Tag Populer</span>
  </div>

  <div style="display:flex;flex-wrap:wrap;gap:10px;">
    {{- range first 20 site.Taxonomies.tags.ByCount }}
    <a href="{{ .Page.Permalink }}" style="display:inline-flex;align-items:center;gap:8px;background:#ffffff;border:1px solid #e5e7eb;border-radius:999px;padding:6px 6px 6px 14px;text-decoration:none;">
      <span style="font-size:14px;font-weight:600;color:#1f2937;">#{{ .Page.Title }}</span>
      <span style="font-size:11px;font-weight:700;color:#ffffff;background:#e60000;border-radius:999px;padding:2px 8px;">{{ .Count }}</span>
    </a>
    {{- end }}
  </div>
</div>
{{- end }}
